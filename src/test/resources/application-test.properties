# Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server Configuration
server.port=8081

# JWT Configuration (test token)
jwt.secret=test-secret-key-for-testing-purposes-only-32chars
jwt.expiration=3600000

# Logging
logging.level.root=WARN
logging.level.org.tifo.footballmanager=INFO

# The tests write the tactics backup to the build directory, not to var/. The production file is the
# owner's world default, and a test that rewrites it is a test that can quietly undo his choice.
app.tactics-backup-path=target/test-tactics-editor-profiles.json
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# Disable banner for tests
spring.main.banner-mode=off

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Never let a test context start pop open a browser. BrowserLauncher is opt-in and
# also refuses to run on this profile, but stating it here makes the intent explicit.
app.open-browser=false

# The game clock moves by itself — it is real time plus an offset — so the half-hourly job
# synchronisation has to be explicitly off here. Left on, it walks the season forward while the suite
# is reading it, and every season assertion becomes time-dependent. Stated rather than left to the
# default, because a default that only exists in a constructor is a default nobody reads.
game.clock.scheduler-enabled=false

# Hibernate statistics, for the guard tests that count SQL or loaded entities.
# Without it those assertions compare zeroes and pass for ever - which has happened here.
hibernate.generate_statistics=true
