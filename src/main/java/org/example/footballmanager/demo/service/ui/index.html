<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TIFO Demo Service — Match Viewer</title>
  <link rel="stylesheet" href="css/pitch.css">
</head>
<body>
  <!-- LED / semaphore header: home — clock/score — away -->
  <header class="led" id="header">
    <div class="team home">
      <span class="name" id="homeName">Home FC</span>
      <span class="score" id="homeScore">0</span>
    </div>
    <div class="clock" id="clock">00:00</div>
    <div class="team away">
      <span class="score" id="awayScore">0</span>
      <span class="name" id="awayName">Away United</span>
    </div>
    <div class="meta">
      <span class="label" id="actionLabel">—</span>
      <span class="label dim" id="statusLabel">—</span>
      <span class="label dim" id="posLabel"></span>
    </div>
  </header>

  <main class="pitch-root">
    <!-- Horizontal pitch: row 1 = AWAY (top), row 7 = HOME (bottom), cols 1-6 -->
    <canvas id="pitch" width="760" height="520" role="img" aria-label="Horizontal football pitch replay"></canvas>

    <aside class="sidebar">
      <div class="panel">
        <h3>Goal timeline</h3>
        <ul id="timeline"></ul>
      </div>

      <div class="panel seek">
        <label>Seek: <input id="seek" type="range" min="0" max="1000" value="0"></label>
        <div class="controls">
          <button id="playBtn">▶ Play</button>
          <button id="pauseBtn">⏸ Pause</button>
          <button id="fileBtn">Load JSON</button>
        </div>
        <input id="fileInput" type="file" accept="*.json" style="display:none">
        <div class="hint">No backend? Use “Load JSON” to open a match.json produced by <code>MatchSnapshotExporter</code>.</div>
      </div>
    </aside>
  </main>

  <script src="js/viewer.js"></script>
</body>
</html>
