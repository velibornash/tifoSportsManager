spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
server.port=${PORT:8080}
hibernate.discriminator.ignore_explicit_for_joined=true


# Game clock (owner, 2026-09-28).
# auto-advance moves the season an hour at a time on the hourly tick, so the season plays itself in
# production. The check half runs either way, so a job missed while the app was down is caught.
game.clock.scheduler-enabled=true
game.clock.auto-advance=true
game.clock.cron=0 0 * * * *
