spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
server.port=${PORT:8080}
hibernate.discriminator.ignore_explicit_for_joined=true


# Game clock (owner, 2026-09-28, rebuilt 2026-10-11).
#
# The clock is real time plus an offset and moves on its own; there is nothing to auto-advance. This
# switch only governs the half-hourly synchronisation that runs whatever the clock has made due,
# including hours missed while the app was down. game.clock.auto-advance is gone with the code that
# read it - a setting left behind is a setting nobody trusts.
game.clock.scheduler-enabled=true
# Every five minutes, so a trigger inside an hour - the 19:45 matchday prepare - is not
# left to the next half hour (owner, 2026-10-22).
game.clock.cron=0/5 * * * * *
