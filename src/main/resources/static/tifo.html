<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TIFO - Clean Sheet Text Mode</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" href="/newLogic/css/dashboard.css">
    <link rel="stylesheet" href="/css/tifo.css">
</head>
<body>
<div class="background"></div>

<div class="tifo-layout">

    <button class="tifo-hamburger" id="tifoHamburger" onclick="toggleMobileSidebar()">☰</button>
    <div class="tifo-sidebar-overlay" id="tifoSidebarOverlay" onclick="toggleMobileSidebar()"></div>

    <div class="tifo-sidebar" id="tifoSidebar">
        <div class="tifo-sidebar-brand">
            <h2>TIFO</h2>
            <small>TEXT MANAGER</small>
        </div>
        <div class="tifo-sidebar-nav">
            <a onclick="tifoBackToMain()" class="tifo-sidebar-lobby">← BACK TO SPORTS LOBBY</a>
            <a onclick="tifoNav('inbox')" id="sidebarInboxBtn">
                📬 INBOX <span class="tifo-sidebar-inbox-badge" id="sidebarInboxBadge" style="display:none">0</span>
            </a>
            <a onclick="tifoNav('managerOffice')" class="tifo-snav-item" id="navManagerOffice">🏢 MANAGER'S OFFICE</a>
            <div class="tifo-sidebar-divider"></div>
            <a onclick="tifoNav('clubInfo')" class="tifo-snav-item" id="navClubInfo">🏟 CLUB INFO</a>
            <a onclick="tifoNav('CPlayers')" class="tifo-snav-item" id="navPlayers">👥 FIRST TEAM</a>
            <a onclick="tifoNav('tactics')" class="tifo-snav-item" id="navTactics">🧠 TACTICS</a>
            <a onclick="tifoNav('transfers')" class="tifo-snav-item" id="navTransfers">💼 TRANSFERS</a>
            <a onclick="tifoNav('training')" class="tifo-snav-item" id="navTraining">🏋️ TRAINING</a>
            <div class="tifo-sidebar-divider"></div>
            <a onclick="tifoNav('leagueTable')" class="tifo-snav-item" id="navLeagueTable">🏆 LEAGUE TABLE</a>
            <a onclick="tifoNav('schedule')" class="tifo-snav-item" id="navSchedule">📅 SCHEDULE</a>
            <a onclick="tifoNav('matches')" class="tifo-snav-item" id="navMatches">📋 MATCH ARCHIVE</a>
            <div class="tifo-sidebar-divider"></div>
            <a onclick="tifoNav('topScorers')" class="tifo-snav-item" id="navTopScorers">⚽ GOLDEN BOOT</a>
            <a onclick="tifoNav('topAssists')" class="tifo-snav-item" id="navTopAssists">🎯 ASSIST CHART</a>
            <a onclick="tifoNav('internationalCentre')" class="tifo-snav-item" id="navInternationalCentre">🌍 INTERNATIONAL</a>
        </div>
        <div class="tifo-sidebar-continue">
            <button id="tifoNextRoundBtn" class="big-button" onclick="tifoNextRound()">▶ NEXT ROUND</button>
        </div>
    </div>

    <div class="tifo-main">
        <div class="top-menu">
            <div id="inboxBtnDesktop" class="menu-button desktop-only" onclick="tifoNav('inbox')">📬 Inbox</div>
            <div id="roundInfo" style="color:#aaa; padding:10px; font-size:0.85em;"></div>
            <div class="desktop-only logo-corner"><img src="/images/logomain.jpg" alt="Logo" class="corner-logo"></div>
            <div class="menu-button mobile-only cs-next-round-wrap">
                <button id="nextRoundBtnMobileTop" class="big-button" onclick="tifoNextRound()">Next</button>
            </div>
            <div class="mobile-only mobile-logo-wrapper"><img src="/images/logomain.jpg" alt="Logo" class="corner-logo"></div>
        </div>

        <div class="dashboard-content">
            <div id="main-content">
                <div class="manager-card" style="text-align:center; padding:40px;">
                    <h2>Loading...</h2>
                </div>
            </div>
        </div>
    </div>

</div>

<script type="module" src="/js/tifo.js"></script>
</body>
</html>
