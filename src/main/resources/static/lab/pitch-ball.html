<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pitch &amp; Ball — drag the ball, watch the team move</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #0b1220; color: #e8ecf4; }
  .wrap { max-width: 900px; margin: 20px auto; padding: 0 16px; display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .left { flex: 1 1 420px; min-width: 320px; }
  .right { flex: 0 0 260px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p.hint { font-size: 13px; color: #9aa7bf; margin: 0 0 14px; }
  .pitch-wrap { position: relative; width: 100%; aspect-ratio: 5 / 8; border-radius: 28px; overflow: hidden; border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 24px 48px rgba(0,0,0,0.26); background: linear-gradient(180deg, rgba(7,63,38,0.98) 0%, rgba(17,98,55,0.98) 100%); }
  .te-pitch-surface { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,0.05) 0, rgba(255,255,255,0.05) 14.29%, transparent 14.29%, transparent 28.57%, rgba(255,255,255,0.04) 28.57%, rgba(255,255,255,0.04) 42.86%, transparent 42.86%, transparent 57.14%, rgba(255,255,255,0.04) 57.14%, rgba(255,255,255,0.04) 71.43%, transparent 71.43%, transparent 85.71%, rgba(255,255,255,0.04) 85.71%, rgba(255,255,255,0.04) 100%, transparent 100%), linear-gradient(90deg, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.03) 16.67%, transparent 16.67%, transparent 33.33%, rgba(255,255,255,0.03) 33.33%, rgba(255,255,255,0.03) 50%, transparent 50%, transparent 66.67%, rgba(255,255,255,0.03) 66.67%, rgba(255,255,255,0.03) 83.33%, transparent 83.33%, transparent 100%); }
  .line { position: absolute; border-color: rgba(255,255,255,0.56); pointer-events: none; }
  .line.mid { left: 0; right: 0; top: 50%; border-top: 2px solid rgba(255,255,255,0.62); }
  .line.circle { width: 26%; height: 16.5%; left: 37%; top: 41.75%; border: 2px solid rgba(255,255,255,0.62); border-radius: 50%; }
  .line.top-box, .line.bottom-box { left: 21%; width: 58%; height: 15.5%; border: 2px solid rgba(255,255,255,0.62); }
  .line.top-box { top: 0; border-top: none; }
  .line.bottom-box { bottom: 0; border-bottom: none; }
  .line.top-six, .line.bottom-six { left: 32%; width: 36%; height: 6%; border: 2px solid rgba(255,255,255,0.62); }
  .line.top-six { top: 0; border-top: none; }
  .line.bottom-six { bottom: 0; border-bottom: none; }
  .cell-label { position: absolute; transform: translate(-50%, -50%); font-size: 9px; color: rgba(255,255,255,0.35); font-family: monospace; pointer-events: none; z-index: 1; }
  .player { position: absolute; width: 40px; height: 40px; border-radius: 50%; background: #4a9eff; border: 2px solid #fff; transform: translate(-50%,-50%); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.4); transition: left 0.15s linear, top 0.15s linear; pointer-events: none; z-index: 2; letter-spacing: -0.5px; }
  .player.gk { background: #f5a623; }
  .ball { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 2px solid #222; transform: translate(-50%,-50%); cursor: grab; z-index: 5; box-shadow: 0 2px 6px rgba(0,0,0,0.5); }
  .ball:active { cursor: grabbing; }
  .controls { display: flex; flex-direction: column; gap: 10px; }
  .controls button { padding: 6px 12px; border-radius: 6px; border: 1px solid #3a4a6b; background: #1a2338; color: #e8ecf4; cursor: pointer; }
  .controls button:hover { background: #2a3550; }
  .controls label { font-size: 13px; color: #9aa7bf; display: flex; align-items: center; gap: 8px; }
  .controls input[type=range] { width: 140px; }
  .info { margin-top: 10px; font-size: 12px; color: #9aa7bf; font-family: monospace; line-height: 1.6; }
  .info b { color: #e8ecf4; }
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <h1>Pitch &amp; Ball — drag the ball</h1>
    <p class="hint">Drag the white ball anywhere. Home (blue) players react: outfield players nudge toward the ball, goalkeeper shifts in his area. Grid is the tactic editor's 7×6. Standalone.</p>
    <div class="pitch-wrap" id="pitch">
      <div style="position:absolute;inset:0;">
        <div class="te-pitch-surface" style="position:absolute;inset:0;"></div>
        <div class="line mid"></div>
        <div class="line circle"></div>
        <div class="line top-box"></div>
        <div class="line bottom-box"></div>
        <div class="line top-six"></div>
        <div class="line bottom-six"></div>
      </div>
      <div id="cells"></div>
      <div id="players"></div>
      <div class="ball" id="ball"></div>
    </div>
  </div>
  <div class="right">
    <div class="controls">
      <button id="reset">Reset positions</button>
      <label>Reaction <input type="range" id="react" min="0" max="1" step="0.05" value="0.35"></label>
    </div>
    <div class="info" id="info"></div>
  </div>
</div>
<script>
// Tactic editor grid: 7 rows (progress 0..6), 6 columns (width 0..5).
// Pitch position (percent): left = (width + 0.5) * (100/6), top = (6.5 - progress) * (100/7).
// 1-based cell label: row = progress+1 (bottom to top), col = width+1 (left to right).
function cellPos(progress, width) {
  return { x: (width + 0.5) * (100 / 6), y: (6.5 - progress) * (100 / 7) };
}
function cellLabel(progress, width) {
  return (progress + 1) + '_' + (width + 1);
}

// Default 4-4-2 formation — copied from the app's source of truth:
// src/main/java/org/tifo/footballmanager/newLogic/service/FormationSlotCatalog.java
// CELL_{progress}_{width}; row = progress+1 (bottom-up), col = width+1.
const baseCells = [
  {role:'GK', label:'GK',  p:0, w:2},  // CELL_0_2
  {role:'DEF', label:'DL',  p:1, w:0},  // CELL_1_0
  {role:'DEF', label:'DCL', p:1, w:1},  // CELL_1_1
  {role:'DEF', label:'DCR', p:1, w:3},  // CELL_1_3
  {role:'DEF', label:'DR',  p:1, w:4},  // CELL_1_4
  {role:'MID', label:'ML',  p:2, w:0},  // CELL_2_0
  {role:'MID', label:'CML', p:2, w:1},  // CELL_2_1
  {role:'MID', label:'CMR', p:2, w:3},  // CELL_2_3
  {role:'MID', label:'MR',  p:2, w:4},  // CELL_2_4
  {role:'ATT', label:'STL', p:4, w:1},  // CELL_4_1
  {role:'ATT', label:'STR', p:4, w:3},  // CELL_4_3
];

let players = baseCells.map(s => {
  const pos = cellPos(s.p, s.w);
  return { role: s.role, label: s.label, base: {x: pos.x, y: pos.y, p: s.p, w: s.w}, pos: {x: pos.x, y: pos.y} };
});
let ball = { x: cellPos(2, 2).x, y: cellPos(2, 2).y };  // starts on CELL_2_2

const pitch = document.getElementById('pitch');
const playersLayer = document.getElementById('players');
const cellsLayer = document.getElementById('cells');
const ballEl = document.getElementById('ball');
const info = document.getElementById('info');

function toPx(xPct, yPct) {
  const r = pitch.getBoundingClientRect();
  return { left: (xPct / 100) * r.width, top: (yPct / 100) * r.height };
}
function toPct(px, py) {
  const r = pitch.getBoundingClientRect();
  return { x: (px / r.width) * 100, y: (py / r.height) * 100 };
}
// Convert internal 0-100% coordinate to 1-based cell coordinate (1.00..7.00).
// x: 1.00 = left edge, 7.00 = right edge (6 cells). y: 1.00 = bottom (home goal), 8.00 = top (away goal).
function toCellCoord(xPct, yPct) {
  return { x: (xPct / 100) * 6 + 1, y: 8 - (yPct / 100) * 7 };
}

function cellString(xPct, yPct) {
  // Internal pct -> "row_col" (1-based, row 1 = bottom).
  const c = toCellCoord(xPct, yPct);
  const row = Math.min(7, Math.max(1, Math.floor(c.y)));
  const col = Math.min(6, Math.max(1, Math.floor(c.x)));
  return row + '_' + col;
}

function render() {
  // cells
  cellsLayer.innerHTML = '';
  for (let p = 0; p <= 6; p++) {
    for (let w = 0; w <= 5; w++) {
      const c = cellPos(p, w);
      const el = document.createElement('div');
      el.className = 'cell-label';
      el.textContent = (p + 1) + '_' + (w + 1);
      const px = toPx(c.x, c.y);
      el.style.left = px.left + 'px';
      el.style.top = px.top + 'px';
      cellsLayer.appendChild(el);
    }
  }
  // players
  playersLayer.innerHTML = '';
  players.forEach(p => {
    const el = document.createElement('div');
    el.className = 'player' + (p.role === 'GK' ? ' gk' : '');
    el.textContent = p.label;
    const px = toPx(p.pos.x, p.pos.y);
    el.style.left = px.left + 'px';
    el.style.top = px.top + 'px';
    playersLayer.appendChild(el);
  });
  // ball
  const bp = toPx(ball.x, ball.y);
  ballEl.style.left = bp.left + 'px';
  ballEl.style.top = bp.top + 'px';
  const bcRow = cellString(ball.x, ball.y);
  const stl = players.find(pp => pp.label === 'STL');
  const str = players.find(pp => pp.label === 'STR');
  const ballC = toCellCoord(ball.x, ball.y);
  const stlC = stl ? toCellCoord(stl.pos.x, stl.pos.y) : null;
  const strC = str ? toCellCoord(str.pos.x, str.pos.y) : null;
  const stlCell = stl ? cellString(stl.pos.x, stl.pos.y) : '-';
  const strCell = str ? cellString(str.pos.x, str.pos.y) : '-';
  info.innerHTML = '<b>Ball cell:</b> ' + bcRow + '<br>'
    + '<b>Ball pos:</b> ' + ballC.y.toFixed(2) + '|' + ballC.x.toFixed(2) + '<br>'
    + '<b>STL pos:</b> ' + (stlC ? stlC.y.toFixed(2) + '|' + stlC.x.toFixed(2) : '-') + ' (cell ' + stlCell + ')<br>'
    + '<b>STR pos:</b> ' + (strC ? strC.y.toFixed(2) + '|' + strC.x.toFixed(2) : '-') + ' (cell ' + strCell + ')<br>'
    + '<b>Players:</b> ' + players.length;
}

function reactToBall() {
  const react = parseFloat(document.getElementById('react').value);
  players.forEach(p => {
    if (p.role === 'GK') {
      const dx = (ball.x - p.base.x) * 0.15;
      const dy = (ball.y - p.base.y) * 0.05;
      p.pos.x = Math.max(30, Math.min(70, p.base.x + dx));
      p.pos.y = Math.max(75, Math.min(95, p.base.y + dy));
      return;
    }
    const dx = ball.x - p.base.x;
    const dy = ball.y - p.base.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 0.01) { p.pos.x = p.base.x; p.pos.y = p.base.y; return; }
    const nudge = Math.min(dist, 25) * react;
    p.pos.x = Math.max(5, Math.min(95, p.base.x + (dx / dist) * nudge));
    p.pos.y = Math.max(5, Math.min(95, p.base.y + (dy / dist) * nudge));
  });
}

let dragging = false;
pitch.addEventListener('pointerdown', (e) => {
  const r = pitch.getBoundingClientRect();
  const c = toPct(e.clientX - r.left, e.clientY - r.top);
  if (Math.hypot(c.x - ball.x, c.y - ball.y) < 5) {
    dragging = true;
    ballEl.setPointerCapture(e.pointerId);
  } else {
    ball.x = Math.max(3, Math.min(97, c.x));
    ball.y = Math.max(3, Math.min(97, c.y));
    reactToBall(); render();
  }
});
pitch.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  const r = pitch.getBoundingClientRect();
  ball.x = Math.max(3, Math.min(97, (e.clientX - r.left) / r.width * 100));
  ball.y = Math.max(3, Math.min(97, (e.clientY - r.top) / r.height * 100));
  reactToBall(); render();
});
pitch.addEventListener('pointerup', () => { dragging = false; });
pitch.addEventListener('pointercancel', () => { dragging = false; });

document.getElementById('reset').addEventListener('click', () => {
  players = baseCells.map(s => { const pos = cellPos(s.p, s.w); return { role: s.role, label: s.label, base: {x: pos.x, y: pos.y, p: s.p, w: s.w}, pos: {x: pos.x, y: pos.y} }; });
  ball = { x: cellPos(2, 2).x, y: cellPos(2, 2).y };
  reactToBall(); render();
});
document.getElementById('react').addEventListener('input', () => { reactToBall(); render(); });

window.addEventListener('resize', render);
reactToBall();
render();
</script>
</body>
</html>
