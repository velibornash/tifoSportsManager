<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omladinac Manager App</title>
  <style>
    body {
      margin: 0; padding: 0; min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      color: white; font-family: Arial, sans-serif;
    }
    .background {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('/images/OmladinacManager.png');
      background-size: contain; background-position: center;
      background-repeat: no-repeat; background-color: #1e7d32;
      z-index: -1;
    }
    .container {
      text-align: center;
      padding: 5vw;
      border-radius: 1rem;
      max-width: 90%;
    }
    button {
      display: block;
      margin: 15px auto;
      padding: 1.5rem 3rem;
      font-size: 1.2rem;
      cursor: pointer;
      border: none;
      border-radius: 0.5rem;
      background-color: rgba(40, 167, 69, 0.7);
      color: white;
      transition: background-color 0.3s;
      width: 280px;
    }
    button:hover { background-color: rgba(33, 136, 56, 0.7); }
    button:disabled { background-color: #666; cursor: not-allowed; }
  </style>
</head>
<body>
<div class="background"></div>

<div class="container">
  <button id="startBtn" onclick="startSimulation()">Start Match Simulation</button>
  <button id="canvasBtn" onclick="startCanvasTest()">Start Canvas Test (22 Players)</button>

  <audio id="backgroundMusic" autoplay>
    <source src="/audio/intro.mp3" type="audio/mpeg">
  </audio>
</div>

<script>
  async function startSimulation() {
      const button = document.getElementById('startBtn');
      button.disabled = true;
      button.textContent = "Pokrećem simulaciju...";

      try {
          const response = await fetch('/matches/start-simulation', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' }
          });

          if (!response.ok) throw new Error('Server error');

          const data = await response.json();

          await new Promise(resolve => setTimeout(resolve, 2200));

          window.location.href = `/match_visualisation.html?matchId=${data.matchId}`;

      } catch (error) {
          console.error(error);
          alert("Greška pri pokretanju simulacije.");
          button.disabled = false;
          button.textContent = "Start Match Simulation";
      }
  }

  async function startCanvasTest() {
      const button = document.getElementById('canvasBtn');
      button.disabled = true;
      button.textContent = "Pokrećem canvas test...";

      try {
          const response = await fetch('/start-canvas-test');
          if (!response.ok) throw new Error('Server error');

          await new Promise(resolve => setTimeout(resolve, 500));

          window.location.href = "/canvastest.html";

      } catch (error) {
          console.error(error);
          alert("Greška pri pokretanju canvas testa.");
          button.disabled = false;
          button.textContent = "Start Canvas Test (22 Players)";
      }
      button.disabled = false;
      button.textContent = "Start Canvas Test (22 Players)";
  }
</script>

</body>
</html>
