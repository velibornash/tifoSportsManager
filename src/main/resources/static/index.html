<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omladinac Manager App</title>
  <style>
    body {
      margin: 0; padding: 0; min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      color: white; font-family: Arial, sans-serif;
    }
    .background {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('/images/OmladinacManager.png');
      background-size: contain; background-position: center;
      background-repeat: no-repeat; background-color: #1e7d32;
      z-index: -1;
    }
    .container { text-align: center; padding: 5vw; border-radius: 1rem; max-width: 90%; }
    button {
      padding: 1.5rem 3rem; font-size: 1.2rem; cursor: pointer;
      border: none; border-radius: 0.5rem;
      background-color: rgba(40, 167, 69, 0.7); color: white;
      transition: background-color 0.3s;
      position: relative; top: 10vh; left: -5vw;
    }
    button:hover { background-color: rgba(33, 136, 56, 0.7); }
    button:disabled { background-color: #666; cursor: not-allowed; }
  </style>
</head>
<body>
<div class="background"></div>
<div class="container">
  <button id="startBtn" onclick="startSimulation()">Start Simulation</button>
  <audio id="backgroundMusic" autoplay>
    <source src="/audio/intro.mp3" type="audio/mpeg">
  </audio>
</div>

<script>
  async function startSimulation() {
      const button = document.getElementById('startBtn');
      button.disabled = true;
      button.textContent = "Pokrećem simulaciju...";

      try {
          const response = await fetch('/matches/start-simulation', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' }
          });

          if (!response.ok) throw new Error('Server error');

          const data = await response.json();

          // Malo čekanja da thread počne i WebSocket uhvati prve evente
          await new Promise(resolve => setTimeout(resolve, 2200));

          window.location.href = `/match_visualisation.html?matchId=${data.matchId}`;

      } catch (error) {
          console.error(error);
          alert("Greška pri pokretanju simulacije. Pokušaj ponovo.");
          button.disabled = false;
          button.textContent = "Start Simulation";
      }
  }
</script>
</body>
</html>
