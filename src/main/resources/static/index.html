<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Omladinac Manager App</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-image: url('/images/OmladinacManager.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: Arial, sans-serif;
    }
    .container {
      text-align: center;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 20px;
      border-radius: 10px;
    }
    button {
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 5px;
      background-color: #28a745;
      color: white;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #218838;
    }
    audio {
      display: none; /* Skriva kontrolu */
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Omladinac Manager App</h1>
  <button onclick="startSimulation()">Start Simulation</button>
  <audio id="backgroundMusic" autoplay>
    <source src="/audio/intro.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>
</div>

<script>
  function startSimulation() {
    window.location.href = "/match_visualisation.html";
    fetch('/matches/start-simulation', { method: 'POST' });
  }

  // Postavi jačinu zvuka na 50% i pokreni muziku
  window.addEventListener('load', () => {
    const audio = document.getElementById('backgroundMusic');
    if (audio) {
      audio.volume = 0.5; // 50% jačina
      audio.play().catch(error => console.log('Auto-play blocked:', error));
    }
  });
</script>
</body>
</html>
