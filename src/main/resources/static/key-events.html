<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Events Simulation</title>
    <link rel="stylesheet" href="/css/key-events.css">
</head>
<body>
<div class="key-header">
    <div id="scoreboard">[0'] Home 0 - 0 Away</div>
    <button id="backBtn" type="button">Back</button>
</div>

<div class="main-grid">
    <div class="event-panel">
        <div id="lastEventBox">Waiting for simulation start...</div>
        <div class="event-content">
            <img id="eventImage" src="" alt="Event">
            <img id="playerImage" src="/images/player.jpg" alt="Player">
            <div id="playerInfo"></div>
        </div>
    </div>

    <div class="right-panel">
        <div class="visual-wrap">
            <canvas id="keyPitch" width="1100" height="560"></canvas>
        </div>
        <div class="feed-panel">
            <h3>Event Feed</h3>
            <div id="eventFeed"></div>
        </div>
    </div>
</div>

<script type="module" src="/js/key-events.js"></script>
</body>
</html>
