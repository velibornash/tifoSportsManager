<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Football Manager Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="background"></div>
<div class="login-container">
    <form id="loginForm">
        <input type="email" placeholder="Email" name="email" required value="test@primer.rs">
        <input type="password" placeholder="Password" name="password" required value="A12345!">
        <button id="loginBtn" type="submit">Login</button>
    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();           // sprečava slanje forme na server (za sada)

        // Opciono: ovde možeš kasnije dodati proveru polja
        // if (!email || !password) { alert("Popuni sva polja"); return; }

        // Preusmeravanje na dashboard
        window.location.href = '/dashboard.html';
    });
</script>

</body>
</html>
