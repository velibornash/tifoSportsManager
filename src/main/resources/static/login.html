<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Tifo Football Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
<body>

<div class="background">
</div>
<div class="logo-corner">
    <img src="/images/logomain.jpg" alt="Tifo Football Manager Logo" class="corner-logo">
</div>
<div class="login-wrapper">
    <div class="login-card glass">
        <h1 class="title">Tifo Football Manager</h1>

        <p class="invite">
            Welcome to the place where tactics are<br>
            made in tavern with beer in your hand.<br>
            <strong>Are you that coach?</strong><br>
        </p>

        <form id="loginForm">
            <div class="input-group">
                <input type="email" placeholder=" " name="email" required value="velibor@example.com">
                <label>Email</label>
            </div>
            <div class="input-group">
                <input type="password" placeholder=" " name="password" required value="A12345!">
                <label>Password</label>
            </div>
            <button id="loginBtn" type="submit">Enter Tifo</button>
        </form>

        <p class="register-link">
	            Still not having a club? <a href="/register.html">Get one here</a>
        </p>
    </div>
</div>

<script type="module"  src="/js/auth.js"></script>
<script type="module" src="/js/login.js"></script>

</body>
</html>
