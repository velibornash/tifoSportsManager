<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basketball Manager - Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Football owns the design system. Load order is the cascade: system, shared
         sports layer, then this sport's colours. -->
    <link rel="stylesheet" href="/css/dashboard.css">
    <link rel="stylesheet" href="/commonmanager/css/common.css">
    <link rel="stylesheet" href="/basketballmanager/css/basketball.css">
</head>
<body>
<div class="background"></div>

<div class="top-menu">
    <div class="menu-button desktop-only" onclick="window.location.href='/home.html'">⚽🏀🏈 Sports Lobby</div>
    <div class="menu-button desktop-only" onclick="loadPage('dashboard')">📊 Dashboard</div>
    <div class="menu-button desktop-only" onclick="loadPage('firstTeam')">🏀 Club</div>
    <div class="menu-button desktop-only" onclick="loadPage('leagueTable')">&#127942; League</div>
    <div class="menu-button desktop-only" onclick="loadPage('stats')">&#128202; Stats</div>
    <div class="menu-button desktop-only" onclick="loadPage('schedule')">&#128197; Schedule</div>
    <div class="menu-button desktop-only" onclick="loadPage('transfers')">&#128176; Transfers</div>
    <div id="live-clock" class="desktop-only live-clock">
        <strong id="clock-time">Loading...</strong>
        <small id="clock-date"></small>
    </div>
    <div class="desktop-only logo-corner"><img src="/images/logomain.jpg" alt="Logo" class="corner-logo"></div>
    <div class="menu-button mobile-only" onclick="cmToggleMobileMenu()">&#9776;</div>
    <div class="mobile-logo-wrapper mobile-only"><img src="/images/logomain.jpg" alt="Logo" class="corner-logo"></div>
</div>

<div id="mobileSidebar" class="sidebar mobile-only">
    <div class="sidebar-content">
        <h3 onclick="cmCloseMobileMenu()">Menu</h3>
        <div class="accordion">
            <div class="accordion-header" onclick="cmToggleAccordion(this)">🏀 Club</div>
            <div class="accordion-content">
                <div onclick="loadPage('firstTeam');cmCloseMobileMenu()">First Team</div>
                <div onclick="loadPage('schedule');cmCloseMobileMenu()">Schedule</div>
                <div onclick="loadPage('transfers');cmCloseMobileMenu()">Transfers</div>
            </div>
        </div>
        <div onclick="loadPage('leagueTable');cmCloseMobileMenu()">&#127942; League</div>
        <div onclick="loadPage('stats');cmCloseMobileMenu()">&#128202; Stats</div>
        <div onclick="loadPage('dashboard');cmCloseMobileMenu()">📊 Dashboard</div>
        <div onclick="window.location.href='/home.html'">⚽🏀🏈 Sports Lobby</div>
        <div onclick="window.location.href='/home.html'">&#127759; All Sports</div>
        <div class="live-clock mobile-only">
            <strong id="clock-time-m">Loading...</strong>
            <small id="clock-date-m"></small>
        </div>
    </div>
</div>
<!-- No `mobile-only` here on purpose: that utility is `display: block !important` inside the
     mobile breakpoint, so on a phone it would pin the dimming backdrop over the whole app and
     make every page unclickable. The overlay is shown by `.active` alone. -->
<div id="mobileOverlay" class="mobile-overlay" onclick="cmCloseMobileMenu()"></div>

<div id="clubSidebar" class="sidebar">
    <div class="sidebar-content">
        <h3 style="color:#f5a623;">Club</h3>
        <div onclick="loadPage('firstTeam')">First Team</div>
        <div onclick="loadPage('schedule')">Schedule</div>
        <div onclick="loadPage('transfers')">Transfers</div>
    </div>
</div>

<div class="dashboard-content">
    <div id="main-content"></div>
</div>

<script type="module">
    import { authFetch, handleAuthFailure } from '/js/auth.js';
    window.authFetch = authFetch;
    window.handleAuthFailure = handleAuthFailure;

    const token = sessionStorage.getItem('token');
    if (!token) {
        window.location.href = '/login.html';
    }
</script>
<script src="/commonmanager/js/common-sidebar.js"></script>
<script src="/commonmanager/js/common-utils.js"></script>
<script src="/basketballmanager/js/basketball-data.js"></script>
<script src="/basketballmanager/js/pages/bb-utils.js"></script>
<script src="/basketballmanager/js/pages/bb-dashboard.js"></script>
<script src="/basketballmanager/js/pages/bb-team.js"></script>
<script src="/basketballmanager/js/pages/bb-player.js"></script>
<script src="/basketballmanager/js/pages/bb-league.js"></script>
<script src="/basketballmanager/js/pages/bb-stats.js"></script>
<script src="/basketballmanager/js/pages/bb-schedule.js"></script>
<script src="/basketballmanager/js/pages/bb-match-viewer.js"></script>
<script src="/basketballmanager/js/pages/bb-router.js"></script>
<script src="/basketballmanager/js/basketball-dashboard.js"></script>
</body>
</html>
