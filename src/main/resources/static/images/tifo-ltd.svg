<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" width="320" height="96" role="img" aria-label="TIFO Ltd.">
  <title>TIFO Ltd.</title>
  <!--
    The default sponsor wordmark for the advertising boards.

    Drawn rather than shipped as a bitmap so it stays crisp on a phone, needs no external asset, and
    carries no licence question. The owner asked for the tifo logo "or another one"; there is no TIFO
    image in the repository - only tifo.css, and the TIFO references in demo/ are frozen reference
    material - so this is the "another one", built from the same idea: block capitals with a tifo
    scroll underneath.
  -->
  <defs>
    <linearGradient id="tifo-ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe6ff"/>
    </linearGradient>
  </defs>

  <rect width="320" height="96" rx="10" fill="#0d1620"/>

  <!-- The letters, drawn as paths so the file has no font dependency. -->
  <g fill="url(#tifo-ink)">
    <path d="M26 26h34v11H49v33H37V37H26z"/>
    <path d="M74 26h11l14 22V26h11v44h-11L85 48v22H74z"/>
    <path d="M136 26h13v33h21v11h-34z"/>
    <path d="M186 26h34v11h-23v7h19v10h-19v5h24v11h-35z"/>
  </g>

  <!-- The dot of the lower-case-ish "i" in Ltd. -->
  <circle cx="243" cy="34" r="5.5" fill="url(#tifo-ink)"/>
  <path d="M238 46h10v24h-10z" fill="url(#tifo-ink)"/>

  <!-- "Ltd." -->
  <g fill="#8fb9d6" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700">
    <text x="256" y="62">Ltd.</text>
  </g>

  <!-- The tifo scroll: a held banner under the name. -->
  <path d="M24 74h272" stroke="#2f7fd0" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <path d="M40 74c14-9 28-9 42 0s28 9 42 0 28-9 42 0 28 9 42 0 28-9 42 0"
        stroke="#2f7fd0" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.9"/>
</svg>
