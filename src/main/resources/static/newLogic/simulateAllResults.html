<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulate All Results</title>
    <style>
        :root {
            --tt-blue: #0826a3;
            --tt-blue-deep: #04145a;
            --tt-yellow: #ffe45a;
            --tt-cyan: #8fe7ff;
            --tt-white: #f7f7f7;
            --tt-red: #ff5050;
            --tt-green: #7dff8d;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Courier New", monospace;
            background: radial-gradient(circle at top, #0d35cd, var(--tt-blue-deep));
            color: var(--tt-white);
            padding: 18px;
        }

        .tt-shell {
            max-width: 1320px;
            margin: 0 auto;
            border: 4px solid var(--tt-yellow);
            background: rgba(3, 19, 84, 0.95);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
        }

        .tt-topbar {
            CSPosition: sticky;
            top: 0;
            z-index: 6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: rgba(1, 10, 52, 0.94);
            border-bottom: 1px solid rgba(255,255,255,0.14);
            backdrop-filter: blur(6px);
        }

        .tt-topbar-copy {
            color: var(--tt-cyan);
            font-size: 0.92rem;
        }

        .tt-head {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 12px;
            align-items: center;
            padding: 10px 14px;
            background: var(--tt-yellow);
            color: #00145e;
            font-weight: 700;
        }

        .tt-page {
            font-size: 1.7rem;
            letter-spacing: 0.08em;
        }

        .tt-title {
            text-align: center;
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        .tt-clock {
            font-size: 1rem;
        }

        .tt-subhead {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--tt-cyan);
            border-top: 1px solid rgba(255,255,255,0.25);
            border-bottom: 1px solid rgba(255,255,255,0.25);
            text-transform: uppercase;
            font-size: 0.92rem;
        }

        .tt-layout {
            display: grid;
            grid-template-columns: minmax(180px, 0.34fr) minmax(0, 1.6fr) minmax(250px, 0.68fr);
            gap: 0;
        }

        .tt-filters {
            padding: 12px 14px 18px;
            border-right: 1px solid rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.03);
            min-width: 0;
        }

        .tt-filter-shell {
            display: grid;
            gap: 10px;
            CSPosition: sticky;
            top: 74px;
        }

        .tt-filter-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .tt-filter-head {
            color: var(--tt-yellow);
            text-transform: uppercase;
            font-weight: 700;
        }

        .tt-filter-summary {
            color: var(--tt-cyan);
            font-size: 0.8rem;
        }

        .tt-filter-toggle {
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.06);
            color: var(--tt-white);
            padding: 6px 10px;
            font: inherit;
            cursor: pointer;
            text-transform: uppercase;
        }

        .tt-filter-toggle:hover {
            background: rgba(255,255,255,0.12);
        }

        .tt-filter-panel {
            display: grid;
            gap: 10px;
            max-height: calc(100vh - 180px);
            overflow: hidden;
            transition: max-height 0.22s ease, opacity 0.18s ease;
        }

        .tt-filter-panel.collapsed {
            max-height: 0;
            opacity: 0;
        }

        .tt-filter-actions {
            display: flex;
            gap: 8px;
        }

        .tt-filter-btn {
            flex: 1;
            border: 1px solid rgba(255,255,255,0.18);
            background: rgba(255,255,255,0.06);
            color: var(--tt-cyan);
            padding: 7px 8px;
            font: inherit;
            cursor: pointer;
        }

        .tt-filter-btn:hover {
            background: rgba(255,255,255,0.12);
        }

        .tt-filter-list {
            display: grid;
            gap: 8px;
            max-height: min(58vh, 520px);
            overflow-y: auto;
            padding-right: 3px;
        }

        .tt-filter-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 8px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
            cursor: pointer;
        }

        .tt-filter-item input {
            accent-color: var(--tt-yellow);
            margin: 0;
        }

        .tt-filter-label {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .tt-filter-badge {
            color: var(--tt-cyan);
            font-size: 0.82rem;
        }

        .tt-board {
            padding: 12px 14px 18px;
            border-right: 1px solid rgba(255,255,255,0.18);
            min-width: 0;
        }

        .tt-league {
            margin-bottom: 18px;
            border: 1px solid rgba(255,255,255,0.18);
        }

        .tt-league-head {
            padding: 6px 10px;
            background: rgba(255, 228, 90, 0.16);
            color: var(--tt-yellow);
            font-weight: 700;
            text-transform: uppercase;
        }

        .tt-match {
            display: grid;
            grid-template-columns: 52px minmax(0, 1fr) 72px minmax(0, 1fr) 64px;
            gap: 8px;
            align-items: center;
            padding: 6px 10px;
            border-top: 1px solid rgba(255,255,255,0.08);
            min-height: 36px;
        }

        .tt-match.user {
            background: rgba(143, 231, 255, 0.11);
            border-left: 4px solid var(--tt-cyan);
        }

        .tt-match.flash {
            animation: ttFlash 0.55s steps(2, jump-none) infinite;
        }

        .tt-match.finished {
            background: rgba(255, 80, 80, 0.16);
            color: #ffdede;
        }

        .tt-CTeam {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .tt-CTeam.scored {
            color: var(--tt-green);
            font-weight: 700;
        }

        .tt-CTeam.flag {
            color: var(--tt-cyan);
            font-weight: 700;
            text-transform: uppercase;
        }

        .tt-score {
            text-align: center;
            color: var(--tt-yellow);
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .tt-status {
            text-align: right;
            color: var(--tt-cyan);
            font-weight: 700;
        }

        .tt-status.finished {
            color: var(--tt-red);
        }

        .tt-side {
            padding: 12px 14px 18px;
            min-width: 0;
        }

        .tt-side-head {
            color: var(--tt-yellow);
            text-transform: uppercase;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .tt-feed {
            display: grid;
            gap: 8px;
        }

        .tt-feed-item {
            padding: 8px 10px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
        }

        .tt-feed-code {
            color: var(--tt-yellow);
            font-weight: 700;
            margin-right: 6px;
        }

        .tt-feed-icon {
            display: inline-block;
            width: 1.35em;
            text-align: center;
            margin-right: 8px;
            color: var(--tt-white);
        }

        .tt-feed-time {
            color: var(--tt-cyan);
            margin-right: 8px;
        }

        .tt-controls {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px 14px;
            border-top: 1px solid rgba(255,255,255,0.18);
            background: rgba(0,0,0,0.18);
        }

        .tt-btn {
            border: 1px solid rgba(255,255,255,0.22);
            background: rgba(255,255,255,0.08);
            color: var(--tt-white);
            padding: 10px 14px;
            font: inherit;
            cursor: pointer;
        }

        .tt-btn:hover {
            background: rgba(255,255,255,0.14);
        }

        .tt-btn.primary {
            border-color: rgba(255, 228, 90, 0.5);
            color: var(--tt-yellow);
        }

        .tt-note {
            color: var(--tt-cyan);
        }

        @keyframes ttFlash {
            0%, 49% { background: rgba(255, 228, 90, 0.18); color: #fff9ca; }
            50%, 100% { background: rgba(255, 255, 255, 0.02); color: var(--tt-white); }
        }

        @media (max-width: 920px) {
            .tt-layout {
                grid-template-columns: 1fr;
            }

            .tt-filters,
            .tt-board {
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,0.18);
            }

            .tt-filter-shell {
                CSPosition: static;
            }

            .tt-filter-panel {
                max-height: none;
            }

            .tt-filter-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                max-height: none;
            }
        }

        @media (max-width: 560px) {
            body {
                padding: 8px;
            }

            .tt-topbar {
                align-items: stretch;
                flex-direction: column;
            }

            .tt-head,
            .tt-subhead,
            .tt-controls {
                grid-template-columns: 1fr;
                display: grid;
                text-align: center;
            }

            .tt-match {
                grid-template-columns: 46px minmax(0, 1fr) 54px;
            }

            .tt-CTeam.away,
            .tt-status {
                grid-column: 2 / 4;
                text-align: left;
            }

            .tt-filter-list {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 430px) {
            .tt-page {
                font-size: 1.35rem;
            }

            .tt-title {
                font-size: 0.94rem;
            }

            .tt-topbar-copy,
            .tt-subhead,
            .tt-note {
                font-size: 0.82rem;
            }

            .tt-btn {
                width: 100%;
            }
        }

        @media (max-height: 450px) and (orientation: landscape) {
            body {
                padding: 6px;
            }

            .tt-topbar {
                padding: 8px 10px;
            }

            .tt-filters,
            .tt-board,
            .tt-side {
                padding: 10px 10px 12px;
            }

            .tt-match {
                min-height: 32px;
                padding: 5px 8px;
            }
        }
    </style>
</head>
<body>
<div class="tt-shell">
    <div class="tt-topbar">
        <button class="tt-btn primary" type="button" onclick="window.location.href='/newLogic/dashboard.html'">Back to Dashboard</button>
        <div class="tt-topbar-copy">Atlantic 537 style live desk. Pick the leagues you want on screen.</div>
    </div>
    <div class="tt-head">
        <div class="tt-page">537</div>
        <div class="tt-title">Atlantic Results Desk</div>
        <div class="tt-clock" id="ttClock">00:00</div>
    </div>
    <div class="tt-subhead">
        <div id="ttWeekLabel">Loading match week...</div>
        <div id="ttMinuteLabel">00'</div>
    </div>
    <div class="tt-layout">
        <div class="tt-filters">
            <div class="tt-filter-shell">
                <div class="tt-filter-bar">
                    <div>
                        <div class="tt-filter-head">League Filters</div>
                        <div class="tt-filter-summary" id="ttFilterSummary">Loading leagues...</div>
                    </div>
                    <button id="ttFilterToggleBtn" class="tt-filter-toggle" type="button" aria-expanded="true">Hide filters</button>
                </div>
                <div class="tt-filter-panel" id="ttFiltersPanel">
                    <div class="tt-filter-actions">
                        <button id="ttSelectAllBtn" class="tt-filter-btn" type="button">Select all</button>
                        <button id="ttDeselectAllBtn" class="tt-filter-btn" type="button">Deselect all</button>
                    </div>
                    <div class="tt-filter-list" id="ttFilterList"></div>
                </div>
            </div>
        </div>
        <div class="tt-board" id="ttBoard"></div>
        <div class="tt-side">
            <div class="tt-side-head">Service Feed</div>
            <div class="tt-feed" id="ttFeed"></div>
        </div>
    </div>
    <div class="tt-controls">
        <div class="tt-note">Live reveal from persisted current-week results</div>
        <button class="tt-btn" type="button" onclick="window.location.href='/newLogic/dashboard.html'">Back To Dashboard</button>
    </div>
</div>
<script type="module" src="/newLogic/js/roundResultsTeletext.js"></script>
</body>
</html>
