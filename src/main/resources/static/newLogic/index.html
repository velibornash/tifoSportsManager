<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Omladinac Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/newLogic/css/login.css">
</head>
<body>

<div class="background"></div>

<div class="login-wrapper">
  <div class="login-card">
    <img src="/images/omladinac.png" alt="Logo" class="login-logo">

    <h1>Omladinac Manager</h1>
    <p class="subtitle">Sign in to your club</p>

    <form id="loginForm">
      <input type="email" placeholder="Email" name="email" required value="test@primer.rs">
      <input type="password" placeholder="Password" name="password" required value="A12345!">
      <button id="loginBtn" type="submit">Login</button>
    </form>
  </div>
</div>
<script type="module"  src="/newLogic/js/auth.js"></script>
<script type="module"  src="/newLogic/js/login.js"></script>

</body>
</html>
