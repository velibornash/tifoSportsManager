<!-- ZOX Match Analytics Dashboard -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOX - Match Analytics</title>
    <link rel="stylesheet" href="/newLogic/css/zox-match-preview.css">
    <link rel="stylesheet" href="/newLogic/css/zox-match-preview.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
</head>
<body>
<div class="zox-page">
    <div class="zox-header">
        <h1>⚽ ZOX Analytics</h1>
        <p>Professional Match Preview & In-Depth Analysis</p>
        <a href="/newLogic/dashboard.html" class="zox-back-btn">← Back to Dashboard</a>
    </div>

    <!-- Tabs for different views -->
    <div class="zox-tabs">
        <button class="tab-btn active" data-tab="preview">📊 Preview</button>
        <button class="tab-btn" data-tab="formation">👥 Formation</button>
        <button class="tab-btn" data-tab="events">📋 Events</button>
        <button class="tab-btn" data-tab="stats">📈 Stats</button>
    </div>

    <div id="zox-content" class="zox-content">
        <!-- Će biti popunjeno sa JavaScriptom -->
        <p style="text-align: center; padding: 40px; color: #888;">Loading match data...</p>
    </div>
</div>

<script type="module" src="/newLogic/js/zox-match-preview.js"></script>
</body>
</html>
