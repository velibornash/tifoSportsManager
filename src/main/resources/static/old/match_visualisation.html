<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>📺 Match Visualisation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
    <style>
        body {
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            text-align: center;
        }
        #lastEventBox {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            padding: 10px 20px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 16px;
            max-width: 700px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            z-index: 10;
        }
        #queueInfo {
            position: absolute;
            bottom: 8px;
            right: 12px;
            font-size: 13px;
            color: #aaa;
            background: rgba(0,0,0,0.6);
            padding: 4px 8px;
            border-radius: 6px;
            z-index: 10;
        }
        canvas {
            display: block;
            margin: 60px auto 10px auto;
            border: 2px solid #555;
            background-color: #1e7d32;
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div id="lastEventBox">⌛ Čekamo događaje...</div>
<div id="queueInfo">Queue: 0 | Proc: false</div>
<button onclick="goBackToIndex()" style="position: absolute; top: 10px; right: 20px; z-index: 11;">⏪ Nazad</button>

<script>
    function goBackToIndex() {
        window.location.href = "/index.html";
    }
</script>

<script>
    let canvasWidth = 700;
    let canvasHeight = 400;

    let lastEvent = null;
    let lastEventBox;
    let queueInfoBox;

    let homeTeamName = null;
    let awayTeamName = null;
    let homeScore = 0;
    let awayScore = 0;

    // Slike
    let playerImg, goalImg, offsideImg, cornerImg, freeKickImg, injuryImg;
    let matchStartingImg, matchEndedImg, penaltyImg, fallbackPlayerImg, dynamicPlayerImg;
    let varImg, shotImg, yellowCardImg, redCardImg;

    let showGoalAnim = false;
    let goalAnimTimer = 0;
    const goalAnimDurationFrames = 90;

    let showMatchStarting = true;
    let matchStartingTimer = 0;
    const matchStartingDurationFrames = 60;

    // Queue + safeguards
    let eventQueue = [];
    let isProcessing = false;
    let currentTimeoutId = null;

    const EVENT_DELAY = 2200;     // 2.2 sekunde za obične evente
    const GOAL_DELAY   = 2800;    // 2.8 sekunde za golove
    const STUCK_TIMEOUT = 9000;   // 9 sekundi max čekanje po eventu

    let lastDrawnEventKey = null;
    let lastProcessStartTime = 0;
    let receivedCounter = 0;

    function preload() {
        playerImg         = loadImage("/images/player.jpg");
        goalImg           = loadImage("/images/goal-gol.gif");
        offsideImg        = loadImage("/images/offside_flag.jpg");
        cornerImg         = loadImage("/images/corner.jpg");
        freeKickImg       = loadImage("/images/free_kick.png");
        injuryImg         = loadImage("/images/injury.jpg");
        matchStartingImg  = loadImage("/images/match_starting.jpg");
        matchEndedImg     = loadImage("/images/match_ended.jpg");
        penaltyImg        = loadImage("/images/penalty.jpg");
        varImg            = loadImage("/images/var.jpg");
        shotImg           = loadImage("/images/shot.jpg");
        yellowCardImg     = loadImage("/images/yellowcard.jpg");
        redCardImg        = loadImage("/images/redcard.png");
        fallbackPlayerImg = loadImage("/images/player.jpg");
        dynamicPlayerImg  = fallbackPlayerImg;
    }

    function setup() {
        let canvas = createCanvas(canvasWidth, canvasHeight);
        canvas.parent(document.body);

        lastEventBox  = document.getElementById('lastEventBox');
        queueInfoBox  = document.getElementById('queueInfo');

        setupWebSocket();
        frameRate(30);
    }

    function updateQueueInfo() {
        if (queueInfoBox) {
            queueInfoBox.textContent = `Queue: ${eventQueue.length} | Proc: ${isProcessing}`;
        }
    }

    function processNextEvent() {
        if (currentTimeoutId) {
            clearTimeout(currentTimeoutId);
            currentTimeoutId = null;
        }

        if (isProcessing || eventQueue.length === 0) {
            updateQueueInfo();
            return;
        }

        isProcessing = true;
        lastProcessStartTime = Date.now();

        let event = eventQueue.shift();

        if (!event || !event.type) {
            console.warn("Nevalidan event preskočen:", event);
            isProcessing = false;
            processNextEvent();
            return;
        }

        console.log(`[${new Date().toLocaleTimeString()}] PROCESS #${eventQueue.length + 1} (queued: ${eventQueue.length}) → ${event.type} (${event.minute || '?'})`);

        try {
            initTeams(event);
            updateScore(event);

            lastEvent = event;
            lastEventBox.textContent = buildLastEventText(event);

            let playerFullName = getPlayerName(event)?.trim();
            if (playerFullName && playerFullName.length > 2) {
                console.log(`→ Loading image for: ${playerFullName}`);
                loadPlayerImageByName(playerFullName);
            } else {
                dynamicPlayerImg = fallbackPlayerImg;
            }

            let delay = (event.type.toLowerCase() === "goal") ? GOAL_DELAY : EVENT_DELAY;

            // Safeguard
            setTimeout(() => {
                if (isProcessing && Date.now() - lastProcessStartTime > STUCK_TIMEOUT) {
                    console.warn(`STUCK DETECTED (${((Date.now() - lastProcessStartTime)/1000).toFixed(1)}s) → force next`);
                    isProcessing = false;
                    processNextEvent();
                }
            }, STUCK_TIMEOUT + 500);

            currentTimeoutId = setTimeout(() => {
                console.log(`[${new Date().toLocaleTimeString()}] Delay završen → ${event.type} (${event.minute || '?'})`);
                isProcessing = false;
                currentTimeoutId = null;
                processNextEvent();
            }, delay);

        } catch (err) {
            console.error("ERROR u processNextEvent:", err);
            isProcessing = false;
            currentTimeoutId = null;
            processNextEvent();
        }

        updateQueueInfo();
    }

    // ────────────────────────────────────────────────
    // DTO HELPER FUNKCIJE
    // ────────────────────────────────────────────────

    function getPlayerName(event) {
        return event.scorerName || event.playerName || event.takerName ||
               event.playerOutName || event.playerInName || "";
    }

    function getTeamName(event) {
        return event.teamName || "";
    }

    function initTeams(event) {
        if (!event) return;
        if (event.homeTeamName) homeTeamName = event.homeTeamName;
        if (event.awayTeamName) awayTeamName = event.awayTeamName;
        if (event.teamName && !homeTeamName) homeTeamName = event.teamName;
        if (event.teamName && event.teamName !== homeTeamName) awayTeamName = event.teamName;
    }

    function buildLastEventText(event) {
        if (!event) return "⌛ Čekamo događaje...";

        let symbol = '📩';
        let type = (event.type || 'Unknown').toLowerCase();
        let minute = event.minute || '?';
        let player = getPlayerName(event);
        let extra = "";

        switch(type) {
            case "goal":               symbol = "⚽"; extra = player ? ` – ${player} Goal!` : ""; break;
            case "yellowcard":         symbol = "🟨"; extra = player ? ` ${player} Yellow card!` : ""; break;
            case "redcard":            symbol = "🟥"; extra = player ? ` ${player} Red card!` : ""; break;
            case "penalty":            symbol = event.scored ? "✅" : "❌"; extra = player ? ` ${player} Penalty!` : ""; break;
            case "injury":             symbol = "❌"; extra = player ? ` ${player} Injury` : ""; break;
            case "substitution":       symbol = "🔄"; extra = ` ${event.playerOutName||'?'} → ${event.playerInName||'?'} `; break;
            case "offside":            symbol = "🚩"; extra = player ? ` ${player} Offside` : ""; break;
            case "corner":             symbol = "⛳"; extra = player ? ` ${player} Corner` : ""; break;
            case "freekick":           symbol = "⚽"; extra = player ? ` ${player} Free kick` : ""; break;
            case "shotontarget":       symbol = "🎯"; extra = player ? ` ${player} Shot on target` : ""; break;
            case "shotofftarget":      symbol = "🎯"; extra = player ? ` ${player} Shot off target` : ""; break;
            case "varreview":          symbol = "📹"; extra = event.decision ? ` (${event.decision})` : ""; break;
            case "chance":             symbol = "⚡"; extra = player ? ` ${player} Chance` : ""; break;
            case "matchstarted":       symbol = "🏁"; extra = " Match started"; break;
            case "matchended":         symbol = "🏁"; extra = ` Match ended with result • ${homeScore}–${awayScore}`; break;
            default:                   extra = player ? ` ${player}` : "";
        }

        return `${symbol}  [${minute}'] ${extra}`;
    }

    function updateScore(event) {
        if (!event || event.type?.toLowerCase() !== "goal") return;

        let team = getTeamName(event);
        if (team === homeTeamName) {
            homeScore++;
            console.log(`HOME GOAL → ${homeScore} : ${awayScore}`);
        } else if (team === awayTeamName) {
            awayScore++;
            console.log(`AWAY GOAL → ${homeScore} : ${awayScore}`);
        }

        showGoalAnim = true;
        goalAnimTimer = 0;
        goalPos = { x: canvasWidth / 2, y: canvasHeight / 2 };
    }

    // ────────────────────────────────────────────────
    // WEBSOCKET
    // ────────────────────────────────────────────────

    let socket;

    function setupWebSocket() {
        const urlParams = new URLSearchParams(window.location.search);
        const matchId = urlParams.get('matchId');

        console.log("Vizualizacija pokrenuta → matchId:", matchId);

        const wsProtocol = window.location.protocol === "https:" ? "wss" : "ws";
        const wsUrl = `${wsProtocol}://${window.location.host}/match-events`;

        function connect() {
            socket = new WebSocket(wsUrl);

            socket.onopen = () => {
                console.log("WS povezan → matchId:", matchId);
                lastEventBox.textContent = "🟢 Povezano – čekamo događaje";
            };

            socket.onmessage = (msg) => {
                receivedCounter++;
                let event;
                try {
                    event = JSON.parse(msg.data);
                } catch (e) {
                    console.warn("Nevalidan JSON primljen:", msg.data.substring(0,80));
                    return;
                }

                if (event.type === 'PING') return;

                console.log(`[${new Date().toLocaleTimeString()}] ← #${receivedCounter} | ${event.type || "?"} | ${event.minute || '?'}′ | queue sada: ${eventQueue.length + 1}`);

                eventQueue.push(event);
                processNextEvent();
                updateQueueInfo();
            };

            socket.onclose = () => {
                console.log("WS zatvoren → reconnect za 2s...");
                lastEventBox.textContent = "🔄 Reconnect...";
                setTimeout(connect, 2000);
            };

            socket.onerror = (err) => console.error("WS greška:", err);
        }

        connect();
    }

    // ────────────────────────────────────────────────
    // CRTANJE – TEREN, ANIMACIJE, INFO...
    // ────────────────────────────────────────────────

    let goalPos = { x: 0, y: 0 };

    function drawField() {
        background(30, 130, 70);

        stroke(255);
        strokeWeight(2);
        noFill();

        rect(10, 50, canvasWidth - 20, canvasHeight - 100);
        line(canvasWidth / 2, 50, canvasWidth / 2, canvasHeight - 50);

        ellipse(canvasWidth / 2, canvasHeight / 2, 100, 100);

        rect(10, canvasHeight / 2 - 75, 100, 150);
        rect(canvasWidth - 110, canvasHeight / 2 - 75, 100, 150);

        rect(10, canvasHeight / 2 - 30, 30, 60);
        rect(canvasWidth - 40, canvasHeight / 2 - 30, 30, 60);

        fill(255);
        noStroke();
        ellipse(60, canvasHeight / 2, 8, 8);
        ellipse(canvasWidth - 60, canvasHeight / 2, 8, 8);
    }

    function mapPositionToCoords(pos) {
        if (!pos) return { x: canvasWidth / 2, y: canvasHeight / 2 };
        const p = pos.toLowerCase();
        const marginX = 60;
        const midY = canvasHeight / 2;
        switch (p) {
            case 'left_wing': return { x: marginX + 80, y: midY - 50 };
            case 'right_wing': return { x: canvasWidth - marginX - 80, y: midY + 50 };
            case 'center': return { x: canvasWidth / 2, y: midY };
            case 'box': return { x: canvasWidth - 110 + 40, y: midY };
            case 'att': return { x: canvasWidth / 2 + 100, y: midY - 50 };
            case 'mid': return { x: canvasWidth / 2, y: midY - 50 };
            case 'def': return { x: canvasWidth / 2 - 150, y: midY };
            case 'penalty_spot': return { x: canvasWidth / 2, y: canvasHeight / 2 + 30 };
            case 'left_half': return { x: canvasWidth / 4, y: midY };
            case 'right_half': return { x: canvasWidth * 3 / 4, y: midY };
            default: return { x: canvasWidth / 2, y: midY };
        }
    }

    function mapPositionToCoordsWithSide(pos, isHome) {
        if (!pos) return { x: canvasWidth / 2, y: canvasHeight / 2 };

        if (pos.toLowerCase() === 'penalty_spot') {
            return isHome
                ? { x: canvasWidth - 60, y: canvasHeight / 2 }
                : { x: 60, y: canvasHeight / 2 };
        }

        let coords = mapPositionToCoords(pos);

        if (isHome) {
            if (coords.x < canvasWidth / 2) {
                coords.x = canvasWidth / 2 + (canvasWidth / 2 - coords.x);
            }
        } else {
            if (coords.x > canvasWidth / 2) {
                coords.x = canvasWidth / 2 - (coords.x - canvasWidth / 2);
            }
        }

        return coords;
    }

    function drawGoalAnimation() {
        if (!showGoalAnim) return;

        imageMode(CENTER);
        image(goalImg, goalPos.x, goalPos.y, 80, 80);

        goalAnimTimer++;
        if (goalAnimTimer > goalAnimDurationFrames) {
            showGoalAnim = false;
        }
    }

    function drawPlayerCenter() {
        imageMode(CENTER);
        image(dynamicPlayerImg || fallbackPlayerImg, canvasWidth / 2, canvasHeight / 2, 120, 120);
    }

    function drawEventImage(img, x, y, w = 120, h = 120) {
        if (!img) return;
        imageMode(CENTER);
        image(img, x, y, w, h);
    }

    function drawPlayerInfo() {
        if (!lastEvent) return;

        let playerName = getPlayerName(lastEvent);
        if (!playerName) return;

        let x = canvasWidth / 2;
        let y = canvasHeight / 2 + 80;

        push();
        fill(0, 0, 0, 150);
        rectMode(CENTER);
        rect(x, y + 60, 300, 140, 10);

        fill('white');
        noStroke();
        textAlign(CENTER, TOP);

        textSize(20);
        textStyle(BOLD);
        text(playerName, x, y);

        textSize(16);
        textStyle(NORMAL);

        text(`📏 Visina: ${lastEvent.playerHeight ? Math.round(lastEvent.playerHeight * 100) + " cm" : "?"}`, x, y + 30);
        text(`⚖️ Težina: ${lastEvent.playerWeight ? lastEvent.playerWeight + " kg" : "?"}`, x, y + 55);
        text(`🎂 Godine: ${lastEvent.playerAge || "?"}`, x, y + 80);
        text(`🥅 Golovi karijera: ${lastEvent.playerTotalGoals || 0}`, x, y + 105);

        pop();
    }

    function drawEventOverlay() {
        if (!lastEvent) return;

        let type = (lastEvent.type || "").toLowerCase();
        let img = null;

        if      (type === "goal")                 img = goalImg;
        else if (type === "offside")              img = offsideImg;
        else if (type === "corner")               img = cornerImg;
        else if (type === "penalty")              img = penaltyImg;
        else if (type === "injury")               img = injuryImg;
        else if (type === "freekick")             img = freeKickImg;
        else if (type.includes("shot"))           img = shotImg;
        else if (type === "varreview")            img = varImg;
        else if (type === "yellowcard")           img = yellowCardImg;
        else if (type === "redcard")              img = redCardImg;

        if (img) {
            imageMode(CENTER);
            image(img, canvasWidth - 60, canvasHeight - 60, 80, 80);
        }
    }

    function loadPlayerImageByName(fullName) {
        if (!fullName || fullName.length < 3) {
            dynamicPlayerImg = fallbackPlayerImg;
            return;
        }

        let fileName = fullName.replace(/\s+/g, "_") + ".jpg";

        loadImage(`/images/${fileName}`,
            img => {
                dynamicPlayerImg = img;
                console.log(`✓ Učitana slika: ${fullName} (${img.width}×${img.height})`);
            },
            err => {
                console.warn(`✗ Nema slike za ${fullName} → fallback`);
                dynamicPlayerImg = fallbackPlayerImg;
            }
        );
    }

    function draw() {
        drawField();

        fill("white");
        noStroke();
        textSize(22);
        textAlign(CENTER, CENTER);
        const home = homeTeamName || "Omladinac";
        const away = awayTeamName || "Sremac";
        text(`${home}  ${homeScore} – ${awayScore}  ${away}`, canvasWidth / 2, 30);

        if (showMatchStarting) {
            imageMode(CENTER);
            image(matchStartingImg, canvasWidth / 2, canvasHeight / 2, canvasWidth, canvasHeight);
            matchStartingTimer++;
            if (matchStartingTimer > matchStartingDurationFrames) showMatchStarting = false;
            updateQueueInfo();
            return;
        }

        if (lastEvent && lastEvent.type?.toLowerCase() === "matchended") {
            imageMode(CENTER);
            image(matchEndedImg, canvasWidth / 2, canvasHeight / 2, 150, 150);
            fill("white");
            textSize(48);
            text("END OF MATCH", canvasWidth / 2, canvasHeight / 2 + 90);
            updateQueueInfo();
            return;
        }

        if (lastEvent) {
            let isHome = getTeamName(lastEvent) === homeTeamName;
            let coords = mapPositionToCoordsWithSide('center', isHome);
            let x = coords.x;
            let y = coords.y;

            let teamColor = (getTeamName(lastEvent) === home) ? color(60,120,255) :
                            (getTeamName(lastEvent) === away) ? color(220,40,40) : color(180);

            let eventType = (lastEvent.type || "").toLowerCase();

            let currentKey = `${eventType}-${lastEvent.minute || '?'}-${getPlayerName(lastEvent)}`;
            if (currentKey !== lastDrawnEventKey) {
                console.log(`Drawing → ${eventType} (${lastEvent.minute || '?'})`);
                lastDrawnEventKey = currentKey;
            }

            noStroke();

            if (eventType === "penalty") {
                drawEventImage(penaltyImg, x, y);
                if (showGoalAnim && lastEvent.scored) drawGoalAnimation();
            } else if (eventType === "goal") {
                drawGoalAnimation();
            } else {
                if (showGoalAnim) {
                    drawGoalAnimation();
                } else {
                    if      (eventType === "offside")     drawEventImage(offsideImg, x, y);
                    else if (eventType === "corner")      drawEventImage(cornerImg, x, y);
                    else if (eventType === "freekick")    drawEventImage(freeKickImg, x, y);
                    else if (eventType === "injury")      drawEventImage(injuryImg, x, y);
                    else if (eventType === "yellowcard") {
                        let blink = frameCount % 30 < 15;
                        fill(blink ? color(255,220,0) : color(220,180,0));
                        rect(x - 12, y - 18, 24, 36, 6);
                    }
                    else if (eventType === "redcard") {
                        let blink = frameCount % 30 < 15;
                        fill(blink ? color(220,0,0) : color(160,0,0));
                        rect(x - 12, y - 18, 24, 36, 6);
                    }
                    else if (eventType.includes("shot")) {
                        fill(teamColor);
                        ellipse(x, y, 16, 16);
                    }
                    else {
                        fill(teamColor);
                        ellipse(x, y, 10, 10);
                    }
                }
            }

            drawPlayerCenter();
            drawPlayerInfo();
        }

        drawEventOverlay();

        fill(220,60,60);
        textSize(13);
        textAlign(LEFT, BOTTOM);
        text(`Img: ${dynamicPlayerImg?.width ? dynamicPlayerImg.width+'×'+dynamicPlayerImg.height : "fallback"}`, 12, canvasHeight-8);

        updateQueueInfo();
    }
</script>
</body>
</html>
