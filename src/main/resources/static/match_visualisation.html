<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>📺 Match Visualisation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
    <style>
        body {
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            text-align: center;
        }
        #lastEventBox {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 20px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 16px;
            max-width: 700px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            z-index: 10;
        }
        canvas {
            display: block;
            margin: 60px auto 10px auto;
            border: 2px solid #555;
            background-color: #1e7d32; /* grass green */
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div id="lastEventBox">⌛ Čekamo događaje...</div>
<button onclick="goBackToIndex()" style="position: absolute; top: 10px; right: 20px; z-index: 11;">⏪ Nazad</button>

<script>
    function goBackToIndex() {
      window.location.href = "/index.html";
    }
</script>

<script>
    let canvasWidth = 700;
    let canvasHeight = 400;

    let lastEvent = null;
    let lastEventBox;

    let homeTeamName = null;
    let awayTeamName = null;
    let homeScore = 0;
    let awayScore = 0;

    // Slike
    let playerImg, goalImg, offsideImg, cornerImg, freeKickImg, injuryImg, matchStartingImg, matchEndedImg, penaltyImg,fallbackPlayerImg, dynamicPlayerImg  ;
    let varImg, shotImg, yellowCardImg, redCardImg;
    let showGoalAnim = false;
    let goalAnimTimer = 0;
    const goalAnimDurationFrames = 90; // 3 seconds at 30fps
    let goalPos = { x: 0, y: 0 };

    let showMatchStarting = true;
    let matchStartingTimer = 0;
    const matchStartingDurationFrames = 60; // 2 sekunde na 30 fps

    function preload() {
        playerImg = loadImage("/images/player.jpg");
        goalImg = loadImage("/images/goal-gol.gif");
        offsideImg = loadImage("/images/offside_flag.jpg");
        cornerImg = loadImage("/images/corner.jpg");
        freeKickImg = loadImage("/images/free_kick.png");
        injuryImg = loadImage("/images/injury.jpg");
        matchStartingImg = loadImage("/images/match_starting.jpg");
        matchEndedImg = loadImage("/images/match_ended.jpg");
        penaltyImg = loadImage("/images/penalty.jpg");
        varImg = loadImage("/images/var.jpg");
        shotImg = loadImage("/images/shot.jpg");
        redCardImg = loadImage("/images/redcard.png");
        yellowCardImg = loadImage("/images/yellowcard.jpg");
        fallbackPlayerImg = loadImage("/images/player.jpg");
        dynamicPlayerImg = loadImage("/images/player.jpg");
    }

    function setup() {
        let canvas = createCanvas(canvasWidth, canvasHeight);
        canvas.parent(document.body);

        lastEventBox = document.getElementById('lastEventBox');

        setupWebSocket();
        frameRate(30);
    }

    function drawField() {
        background(30, 130, 70); // Grass green

        stroke(255);
        strokeWeight(2);
        noFill();

        rect(10, 50, canvasWidth - 20, canvasHeight - 100); // Field outline
        line(canvasWidth / 2, 50, canvasWidth / 2, canvasHeight - 50); // Center line vertical

        ellipse(canvasWidth / 2, canvasHeight / 2, 100, 100); // Center circle

        rect(10, canvasHeight / 2 - 75, 100, 150); // Left penalty box
        rect(canvasWidth - 110, canvasHeight / 2 - 75, 100, 150); // Right penalty box

        rect(10, canvasHeight / 2 - 30, 30, 60); // Left goal box
        rect(canvasWidth - 40, canvasHeight / 2 - 30, 30, 60); // Right goal box

        fill(255);
        noStroke();
        ellipse(60, canvasHeight / 2, 8, 8); // Left penalty mark
        ellipse(canvasWidth - 60, canvasHeight / 2, 8, 8); // Right penalty mark
    }

    function mapPositionToCoords(pos) {
        if (!pos) return { x: canvasWidth / 2, y: canvasHeight / 2 };
        const p = pos.toLowerCase();
        const marginX = 60;
        const midY = canvasHeight / 2;
        switch (p) {
            case 'left_wing': return { x: marginX + 80, y: midY - 50 };
            case 'right_wing': return { x: canvasWidth - marginX - 80, y: midY + 50 };
            case 'center': return { x: canvasWidth / 2, y: midY };
            case 'box': return { x: canvasWidth - 110 + 40, y: midY };
            case 'att': return { x: canvasWidth / 2 + 100, y: midY - 50 };
            case 'mid': return { x: canvasWidth / 2, y: midY - 50 };
            case 'def': return { x: canvasWidth / 2 - 150, y: midY };
            case 'penalty_spot': return { x: canvasWidth / 2, y: canvasHeight / 2 + 30 };
            case 'left_half': return { x: canvasWidth / 4, y: midY };
            case 'right_half': return { x: canvasWidth * 3 / 4, y: midY };
            default: return { x: canvasWidth / 2, y: midY };
        }
    }

    function mapPositionToCoordsWithSide(pos, isHome) {
        if (!pos) return { x: canvasWidth / 2, y: canvasHeight / 2 };

        if (pos.toLowerCase() === 'penalty_spot') {
            if (isHome) {
                return { x: canvasWidth - 60, y: canvasHeight / 2 };
            } else {
                return { x: 60, y: canvasHeight / 2 };
            }
        }

        let coords = mapPositionToCoords(pos);

        if (isHome) {
            if (coords.x < canvasWidth / 2) {
                coords.x = canvasWidth / 2 + (canvasWidth / 2 - coords.x);
            }
        } else {
            if (coords.x > canvasWidth / 2) {
                coords.x = canvasWidth / 2 - (coords.x - canvasWidth / 2);
            }
        }

        return coords;
    }

    function getPlayerName(event) {
        if (!event) return "";
        if (event.scorer?.name) return event.scorer.name;
        if (event.shooter?.name) return event.shooter.name;
        if (event.taker?.name) return event.taker.name;
        if (event.player?.name) return event.player.name;
        if (event.injuredPlayer?.name) return event.injuredPlayer.name;
        if (event.assister?.name) return event.assister.name;
        if (event.creator?.name) return event.creator.name;
        if (event.offender?.name) return event.offender.name;
        if (event.playerName) return event.playerName;
        return "";
    }

        function getPlayerObject(event) {
        if (!event) return "";
        if (event.scorer) return event.scorer;
        if (event.shooter) return event.shooter;
        if (event.taker) return event.taker;
        if (event.player) return event.player;
        if (event.injuredPlayer) return event.injuredPlayer;
        if (event.assister) return event.assister;
        if (event.creator) return event.creator;
        if (event.offender) return event.offender;
        return "";
    }
function initTeams(event) {
    if (!event?.match) return;

    if (!homeTeamName) homeTeamName = event.match.homeTeam.name;
    if (!awayTeamName) awayTeamName = event.match.awayTeam.name;
}

    function buildLastEventText(event) {
        if (!event) return "⌛ Čekamo događaje...";
        let symbol = '📩';
        let type = event.type || 'Unknown';
        let minute = event.minute || '?';
        let playerName = getPlayerName(event);
        let playerObject = getPlayerObject(event);
        if (playerObject && playerObject.name) {
            dynamicPlayerImg = loadPlayerImageByName(playerObject.name);
        }
        else
        {
            dynamicPlayerImg = fallbackPlayerImg;
    }
        let extra = "";

        switch(type.toLowerCase()) {
            case "goal":
                symbol = "⚽";
                extra = playerName ? ` - ${playerName}` : "";
                break;
            case "yellow card":
            case "yellow card second":
            case "yellow card first":
                symbol = "🟨";
                extra = playerName ? `: ${playerName}` : "";
                break;
            case "red card":
                symbol = "🔴";
                extra = playerName ? `: ${playerName}` : "";
                break;
            case "penalty":
                symbol = event.scored ? "✅" : "❌";
                extra = playerName ? `: ${playerName}` : "";
                break;
            case "injury":
                symbol = "❌";
                extra = playerName ? `: ${playerName}` : "";
                break;
            case "offside":
                symbol = "🚩";
                extra = playerName ? `: ${playerName}` : "";
                break;
            case "corner":
                symbol = "⭯";
                extra = playerName ? `: ${playerName}` : "";
                break;
            case "var review":
                symbol = "📹";
                extra = playerName ? `: ${playerName}` : "";
                break;
            default:
                extra = playerName ? `: ${playerName}` : "";
        }

        return `${symbol} [${minute}'] ${type}${extra}`;
    }

    function updateScore(event) {
        if (!event.team || !event.type) return;

        if (!homeTeamName) homeTeamName = event.team.name;
        else if (!awayTeamName && event.team.name !== homeTeamName) awayTeamName = event.team.name;

        console.log(`updateScore called with event.type=${event.type}, scored=${event.scored}, team=${event.team.name}`);

        const type = event.type.toLowerCase();

        if (type === "goal") {
            if (event.team.name === homeTeamName) {
                homeScore++;
                console.log(`Home score updated: ${homeScore}`);
            } else if (event.team.name === awayTeamName) {
                awayScore++;
                console.log(`Away score updated: ${awayScore}`);
            }
            showGoalAnim = true;
            goalAnimTimer = 0;
            goalPos = mapPositionToCoordsWithSide(event.playerPosition || event.ballPosition || 'center', event.team.name === homeTeamName);
        }
    }

    function setupWebSocket() {
       const wsProtocol = window.location.protocol === "https:" ? "wss" : "ws";
       const socket = new WebSocket(`${wsProtocol}://${window.location.host}/match-events`);

        socket.onopen = () => console.log("✅ WebSocket connected");

        socket.onmessage = (msg) => {
            let event = JSON.parse(msg.data);
            console.log("📩 Event received:", event);
            initTeams(event);
            updateScore(event);

            lastEvent = event;
            lastEventBox.textContent = buildLastEventText(event);
        };

        socket.onclose = () => console.log("❌ WebSocket closed");
    }

    function drawGoalAnimation() {
        if (!showGoalAnim) return;

        imageMode(CENTER);
        image(goalImg, goalPos.x, goalPos.y, 80, 80);

        goalAnimTimer++;
        if (goalAnimTimer > goalAnimDurationFrames) {
            showGoalAnim = false;
            goalAnimTimer = 0;
        }
    }

    function jitterCoord(coord) {
        return {
            x: coord.x + random(-10, 10),
            y: coord.y + random(-10, 10)
        };
    }

    function drawPlayerCenter() {
        imageMode(CENTER);
        if (dynamicPlayerImg) {
            image(dynamicPlayerImg, canvasWidth / 2, canvasHeight / 2, 120, 120);
        } else if (fallbackPlayerImg) {
            image(fallbackPlayerImg, canvasWidth / 2, canvasHeight / 2, 120, 120);
        }
    }


    function drawEventImage(img, x, y, w = 120, h = 120) {
        if (!img) return;
        imageMode(CENTER);
        image(img, x, y, w, h);
    }

    function drawPlayerInfo() {
        if (!lastEvent) return;

        let player = getPlayerObject(lastEvent);
        if (!player) return;

        let fullName = player.name;

        let x = canvasWidth / 2;
        let y = canvasHeight / 2 + 80;

        push();  // Čuva trenutno stanje (fill, stroke, rectMode...)
        // Pozadina poluprovidna ispod teksta
        fill(0, 0, 0, 150);
        rectMode(CENTER);
        rect(x, y + 60, 260, 110, 10);

        // Vrati rectMode na default CORNER da ne bi remetio crtanje terena
        rectMode(CORNER);

        // Tekst
        fill('white');
        noStroke();
        textAlign(CENTER, TOP);

        textSize(20);
        textStyle(BOLD);
        text(fullName, x, y);

        textSize(16);
        textStyle(NORMAL);

        text(`📏 Visina: ${Math.round(player.height * 100)} cm`, x, y + 30);
        text(`⚖️ Težina: ${player.weight} kg`, x, y + 55);
        text(`🎂 Godine: ${player.age}`, x, y + 80);
        text(`🥅 Golovi ukupno: ${player.totalGoals}`, x, y + 105);
    }


function loadPlayerImageByName(fullName) {
    if (!fullName) {
        dynamicPlayerImg = fallbackPlayerImg;
        return;
    }

    let fileName = fullName.replace(/\s+/g, "_") + ".jpg";

    loadImage(`/images/${fileName}`,
        img => {
            dynamicPlayerImg = img;
            console.log("Loaded player image for", fullName);
        },
        err => {
            console.log("Failed to load player image for", fullName, ", using fallback");
            dynamicPlayerImg = fallbackPlayerImg;
        }
    );
}
function drawEventOverlay() {
    if (!lastEvent) return;

    let type = lastEvent.type.toLowerCase();
    let img = null;

    if (type === "goal") img = goalImg;
    else if (type.includes("offside")) img = offsideImg;
    else if (type.includes("corner")) img = cornerImg;
    else if (type.includes("penalty")) img = penaltyImg;
    else if (type.includes("injury")) img = injuryImg;
    else if (type.includes("free kick")) img = freeKickImg;
    else if (type.includes("shot")) img = shotImg;
    else if (type.includes("var")) img = varImg;
    else if (type.includes("yellow card")) img = yellowCardImg;
    else if (type.includes("red card")) img = redCardImg;

    if (img) {
        imageMode(CENTER);
        image(img, canvasWidth - 60, canvasHeight - 60, 80, 80);
    }

}

    function draw() {
        drawField();

        // Prikaz rezultata i timova
        fill("white");
        noStroke();
        textSize(22);
        textAlign(CENTER, CENTER);
        const homeName = homeTeamName || "Omladinac";
        const awayName = awayTeamName || "Sloga";
        text(`${homeName} ${homeScore} - ${awayScore} ${awayName}`, canvasWidth / 2, 30);

        // Prikaz match starting slike na početku (oko 2 sekunde)
        if (showMatchStarting) {
            imageMode(CENTER);
            image(matchStartingImg, canvasWidth / 2, canvasHeight / 2, canvasWidth, canvasHeight);
            matchStartingTimer++;
            if (matchStartingTimer > matchStartingDurationFrames) {
                showMatchStarting = false;
            }
            return;
        }

        // Kraj utakmice sa slikom
        if (lastEvent && lastEvent.type.toLowerCase() === "match ended") {
            imageMode(CENTER);
            image(matchEndedImg, canvasWidth / 2, canvasHeight / 2, 150, 150);

            fill("white");
            textSize(48);
            text("🏁 Kraj utakmice", canvasWidth / 2, canvasHeight / 2 + 90);
            return;
        }

        if (lastEvent) {
            let isHome = lastEvent.team?.name === homeTeamName;
            let coords = mapPositionToCoordsWithSide(lastEvent.playerPosition || lastEvent.ballPosition || 'center', isHome);
            let x = coords.x;
            let y = coords.y;

            let teamColor = 'gray';
            if (lastEvent.team?.name === homeName) teamColor = 'blue';
            else if (lastEvent.team?.name === awayName) teamColor = 'red';

            let eventType = lastEvent.type.toLowerCase();

            console.log("🎯 Drawing eventType:", eventType);

            noStroke();

            // Prikaz event slike ili crteža prema tipu događaja
            if (eventType === "penalty") {
                drawEventImage(penaltyImg, x, y);
                if (showGoalAnim && lastEvent.scored) {
                    drawGoalAnimation();
                }
            } else if (eventType === "goal") {
                drawGoalAnimation();
            }
            else {
                if (showGoalAnim) {
                    drawGoalAnimation();
                } else {
                    // Slike za specificirane evente
                    if (eventType.includes("offside")) {
                        drawEventImage(offsideImg, x, y);
                    } else if (eventType.includes("corner")) {
                        drawEventImage(cornerImg, x, y);
                    } else if (eventType.includes("free kick")) {
                        drawEventImage(freeKickImg, x, y);
                    } else if (eventType.includes("injury")) {
                        drawEventImage(injuryImg, x, y);
                    } else if (eventType.includes("yellow card")) {
                        let blink = frameCount % 30 < 15;
                        fill(blink ? 'yellow' : 'orange');
                        rect(x - 10, y - 15, 20, 30, 5);
                    } else if (eventType.includes("red card")) {
                        let blink = frameCount % 30 < 15;
                        fill(blink ? 'red' : 'darkred');
                        rect(x - 10, y - 15, 20, 30, 5);
                    } else if (eventType.includes("chance")) {
                        fill('cyan');
                        ellipse(x, y, 16, 16);
                    } else if (eventType.includes("var review")) {
                        fill('white');
                        textSize(18);
                        text("📹", x, y);
                    } else if (eventType.includes("shot")) {
                        fill(teamColor);
                        ellipse(x, y, 15, 15);
                    } else {
                        fill(teamColor);
                        ellipse(x, y, 10, 10);
                    }
                }
            }

            // Uvek crtamo player.jpg u centru terena uz event (ako ima eventa)
            drawPlayerCenter();
            drawPlayerInfo();

        } else {
            // Nema eventa, ali ako je goal animacija, crtamo je
            if (showGoalAnim) drawGoalAnimation();
        }
        drawEventOverlay();
    }
</script>
</body>
</html>
