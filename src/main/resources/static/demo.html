<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/demo.css">
    <title>Demo Simulation</title>
</head>
<body>

<div id="scoreboard">Match 0 - 0</div>
<canvas id="pitch" width="900" height="500"></canvas>

<div id="events-container">
    <div id="lastEventBox">Waiting for simulation start...</div>
    <div class="event-content">
        <img id="eventImage" src="" alt="Event">
        <img id="playerImage" src="/images/player.jpg" alt="Player">
        <div id="playerInfo"></div>
    </div>
</div>

<button onclick="cleanupAndGoBack()">Back</button>

<script type="module">
    import { initCanvas } from './js/demo/canvasRenderer.js';
    import { initSockets } from './js/demo/sockets.js';
    import { initEventProcessor } from './js/demo/eventProcessor.js';
    import { initScoreboard } from './js/demo/scoreboard.js';
    import { cleanupDemo } from './js/demo/demoCleanup.js';

    document.addEventListener('DOMContentLoaded', () => {
        initCanvas();
        initScoreboard();
        initEventProcessor();
        initSockets();
    });

    window.cleanupAndGoBack = function () {
        cleanupDemo();
        window.location.href = '/dashboard.html';
    };

    window.addEventListener('beforeunload', cleanupDemo);
</script>

</body>
</html>
