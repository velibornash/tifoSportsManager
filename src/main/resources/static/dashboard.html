<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Demo FC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="background"></div>

<div class="top-menu">
    <button class="disabled" title="Coming soon">Matches</button>
    <button class="disabled" title="Coming soon">Tactics</button>
    <button class="disabled" title="Coming soon">League Table</button>
    <button class="disabled" title="Coming soon">Forum</button>
    <button id="demoBtn" onclick="startSimulation()">Demo</button>
</div>

<div class="dashboard-content">
    <div class="team-card">
        <div class="team-header">
            <img
                    src="/images/omladinac.png"
                    alt="Omladinac"
                    class="team-logo"
            >
            <div class="team-name-wrapper">
                <h1>OFK Omladinac</h1>
                <p class="team-subtitle">Serbian League Division 2 • Season 2025/26</p>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-value">1</div>
                <div class="stat-label">Position</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">34</div>
                <div class="stat-label">Points</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">10-4-5</div>
                <div class="stat-label">W-D-L</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">+12</div>
                <div class="stat-label">Goal Diff</div>
            </div>
        </div>

        <div class="next-match">
            <h3>Next Match</h3>
            <div class="match-info">
                <div class="team-away-home">
                    <img
                            src="/images/sremac.jpg"
                            alt="Sremac"
                            class="match-team-logo small"
                    >
                    <span class="home">Sremac Berkasovo</span>
                </div>

                <span class="vs">vs</span>

                <div class="team-away-home">
                    <img
                            src="/images/omladinac.png"
                            alt="FK Omladinac"
                            class="match-team-logo small"
                    >
                    <span class="away">FK Omladinac</span>
                </div>
            </div>
            <div class="match-date">15.03.2026 • 17:00 • Stadion Livadice</div>
        </div>

        <div class="quick-stats">
            <div>Form: <span class="form-good">W W D L W</span></div>
            <div>Top Scorer: LJ. Ozegovic — 11 goals</div>
        </div>
    </div>
</div>

<script>
    async function startSimulation() {
        const button = document.getElementById('demoBtn');
        // button.disabled = true;  // opciono
        window.location.href = '/index.html';
    }
</script>

</body>
</html>
